name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: chave-de-teste-usada-somente-na-integracao-continua
  DEBUG: 'True'
  DATABASE_URL: postgres://dataledger:dataledger@localhost:5432/dataledger

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataledger
          POSTGRES_USER: dataledger
          POSTGRES_PASSWORD: dataledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements/dev.txt

      - name: Instalar dependências
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Verificação do Django (system check)
        run: python manage.py check

      - name: Migrações aplicam em banco vazio
        run: python manage.py migrate

      - name: Testes (pytest)
        run: pytest
