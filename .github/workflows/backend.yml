name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: chave-de-teste-usada-somente-na-integracao-continua
  DEBUG: 'True'
  DATABASE_URL: postgres://dataledger:dataledger@localhost:5432/dataledger

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataledger
          POSTGRES_USER: dataledger
          POSTGRES_PASSWORD: dataledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements/dev.txt

      - name: Instalar dependências
        run: pip install -r requirements/dev.txt

      # BL-119, decidida POR MEDIÇÃO e não por suposição. O achado 6 da rodada
      # 1 (a indentação hierárquica que nunca era aplicada) só apareceu porque
      # alguém MEDIU o CSS num navegador — e apareceu duas vezes, por causas
      # diferentes, na mesma entrega. A defesa textual que existe hoje pega a
      # FORMA de uma das quebras, não o efeito: o auditor derrubou o efeito por
      # outra via (`!important` numa regra posterior) e, sem navegador, zero
      # testes morreram.
      #
      # Eu havia levantado a hipótese de que o runner já subia o Chromium
      # sozinho — `/usr/bin/chromium` existe nele — e escrevi o critério para
      # poder dizer NÃO: "se os testes de efeito aparecerem como `passed` na
      # CI, fecha sem tocar no workflow; se aparecerem como `skipped`, entra a
      # instalação". O auditor leu o log real da revisão `d046baf`:
      # **606 passed, 2 skipped**. A hipótese estava errada, e o critério
      # informou isso sem eu precisar defendê-la.
      #
      # `--no-sandbox`, `--disable-dev-shm-usage` e `--user-data-dir` próprio
      # já são usados pelos testes; o que faltava era o navegador subir. A
      # condição de pulo continua medindo CAPACIDADE (não presença do
      # binário), então se esta instalação falhar num runner futuro os testes
      # voltam a pular com motivo, em vez de derrubar a suíte — que foi o
      # defeito de `aa10f20`.
      - name: Instalar navegador para os testes que medem CSS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser || \
            sudo apt-get install -y --no-install-recommends chromium

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Verificação do Django (system check)
        run: python manage.py check

      - name: Migrações aplicam em banco vazio
        run: python manage.py migrate

      - name: Testes (pytest)
        # `-rs` lista os testes PULADOS com o motivo. Sem isso, o log da CI
        # diz "606 passed, 2 skipped" e não diz por quê — foi exatamente o
        # dado que faltou para decidir a BL-119, e o auditor precisou inferir.
        # Teste pulado em silêncio é verificação que some sem avisar.
        run: pytest -rs

      # STORAGES usa CompressedManifestStaticFilesStorage (WhiteNoise), que
      # exige o manifesto gerado por collectstatic. Sem esta etapa, o
      # pipeline de estáticos nunca era exercido pela integração contínua, e
      # uma falha só apareceria no deploy. Ver docs/projeto/decisoes.md,
      # DE-012.
      #
      # Roda DEPOIS do pytest de propósito: se rodasse antes, o manifesto
      # existiria durante os testes e a CI passaria com `{% static %}` em
      # template, enquanto o pytest local (sem manifesto) falharia. CI mais
      # permissiva que o ambiente local mascara defeito em vez de revelar.
      - name: Arquivos estáticos são coletados
        run: python manage.py collectstatic --noinput
