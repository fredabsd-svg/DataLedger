<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Gauntlet Loop de qualidade do DataLedger</title>
  <desc id="desc">Ciclo visual de planejar, implementar, testar, atacar, corrigir, auditar e integrar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#101826"/></linearGradient>
    <linearGradient id="line" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#A371F7"/><stop offset="1" stop-color="#3FB950"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="27" fill="none" stroke="#30363D" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="52" y="58" font-size="28" fill="#E6EDF3" font-weight="800">Gauntlet Loop</text>
    <text x="52" y="84" font-size="15" fill="#8B949E">Cada volta precisa produzir evidência melhor que a anterior.</text>

    <path d="M105 172 C170 106 255 106 320 172 S470 238 535 172 685 106 750 172 900 238 965 172 1080 125 1110 172" fill="none" stroke="url(#line)" stroke-width="4" opacity=".8" filter="url(#glow)"/>
    <path d="m1098 160 14 12-14 12" fill="none" stroke="#3FB950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g text-anchor="middle">
      <g transform="translate(120 172)"><circle r="37" fill="#102832" stroke="#22D3EE" stroke-width="2"/><text y="5" font-size="24" fill="#22D3EE">1</text><text y="63" font-size="14" fill="#E6EDF3" font-weight="700">Planejar</text><text y="82" font-size="11" fill="#8B949E">escopo + risco</text></g>
      <g transform="translate(280 132)"><circle r="37" fill="#102832" stroke="#22D3EE" stroke-width="2"/><text y="5" font-size="24" fill="#22D3EE">2</text><text y="63" font-size="14" fill="#E6EDF3" font-weight="700">Implementar</text><text y="82" font-size="11" fill="#8B949E">incremento pequeno</text></g>
      <g transform="translate(440 204)"><circle r="37" fill="#171D32" stroke="#58A6FF" stroke-width="2"/><text y="5" font-size="24" fill="#58A6FF">3</text><text y="63" font-size="14" fill="#E6EDF3" font-weight="700">Testar</text><text y="82" font-size="11" fill="#8B949E">comportamento real</text></g>
      <g transform="translate(600 132)"><circle r="37" fill="#211A32" stroke="#A371F7" stroke-width="2"/><text y="5" font-size="24" fill="#A371F7">4</text><text y="63" font-size="14" fill="#E6EDF3" font-weight="700">Atacar</text><text y="82" font-size="11" fill="#8B949E">mutação + corrida</text></g>
      <g transform="translate(760 204)"><circle r="37" fill="#211A32" stroke="#A371F7" stroke-width="2"/><text y="5" font-size="24" fill="#A371F7">5</text><text y="63" font-size="14" fill="#E6EDF3" font-weight="700">Corrigir</text><text y="82" font-size="11" fill="#8B949E">raiz, não sintoma</text></g>
      <g transform="translate(920 132)"><circle r="37" fill="#15251D" stroke="#3FB950" stroke-width="2"/><text y="5" font-size="24" fill="#3FB950">6</text><text y="63" font-size="14" fill="#E6EDF3" font-weight="700">Auditar</text><text y="82" font-size="11" fill="#8B949E">diff + evidência</text></g>
      <g transform="translate(1080 204)"><circle r="37" fill="#15251D" stroke="#3FB950" stroke-width="2"/><text y="5" font-size="24" fill="#3FB950">7</text><text y="63" font-size="14" fill="#E6EDF3" font-weight="700">Integrar</text><text y="82" font-size="11" fill="#8B949E">PR + CI + revisão</text></g>
    </g>

    <rect x="420" y="285" width="360" height="28" rx="14" fill="#0B2E23" stroke="#3FB950" stroke-opacity=".35"/>
    <circle cx="445" cy="299" r="5" fill="#3FB950"/><text x="460" y="304" font-size="12" fill="#7EE2A8">Se a prova não resiste ao ataque, o loop continua.</text>
  </g>
</svg>
