<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Contribuindo com o DataLedger</title>
  <desc id="desc">Ilustração de branch, testes, revisão e pull request conectados em um fluxo de contribuição.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="360"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#121826"/></linearGradient>
    <linearGradient id="g" x1="110" y1="80" x2="770" y2="280"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#A371F7"/><stop offset="1" stop-color="#3FB950"/></linearGradient>
  </defs>
  <rect width="900" height="360" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="358" rx="25" fill="none" stroke="#30363D" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="44" y="58" font-size="25" fill="#E6EDF3" font-weight="800">Contribuição é parte da arquitetura</text>
    <text x="44" y="84" font-size="14" fill="#8B949E">Mudanças pequenas. Evidência explícita. Histórico preservado.</text>

    <g transform="translate(48 118)">
      <rect width="470" height="190" rx="18" fill="#0B121B" stroke="#30363D"/>
      <rect x="18" y="18" width="434" height="34" rx="9" fill="#111C28"/>
      <circle cx="38" cy="35" r="5" fill="#F85149"/><circle cx="56" cy="35" r="5" fill="#D29922"/><circle cx="74" cy="35" r="5" fill="#3FB950"/>
      <text x="96" y="40" font-size="13" fill="#C9D1D9">docs/dl-012-readme-visual</text>
      <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">
        <text x="28" y="78" fill="#8B949E">$</text><text x="45" y="78" fill="#E6EDF3">ruff check .</text><text x="370" y="78" fill="#3FB950">✓</text>
        <text x="28" y="105" fill="#8B949E">$</text><text x="45" y="105" fill="#E6EDF3">pytest</text><text x="370" y="105" fill="#3FB950">✓</text>
        <text x="28" y="132" fill="#8B949E">$</text><text x="45" y="132" fill="#E6EDF3">validate-docs.ps1</text><text x="370" y="132" fill="#3FB950">✓</text>
      </g>
      <rect x="28" y="151" width="170" height="24" rx="8" fill="#10252B"/><circle cx="42" cy="163" r="4" fill="#22D3EE"/><text x="54" y="168" font-size="11" fill="#7EE7F5">diff revisado</text>
      <rect x="210" y="151" width="185" height="24" rx="8" fill="#15251D"/><circle cx="224" cy="163" r="4" fill="#3FB950"/><text x="236" y="168" font-size="11" fill="#7EE2A8">sem segredos</text>
    </g>

    <g transform="translate(580 84)">
      <path d="M54 40v162" stroke="#30363D" stroke-width="5" stroke-linecap="round"/>
      <path d="M54 75c44 0 44 48 88 48h38" fill="none" stroke="#A371F7" stroke-width="4" stroke-linecap="round"/>
      <path d="M54 166c44 0 44-43 88-43" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>
      <circle cx="54" cy="40" r="13" fill="#0D1117" stroke="#22D3EE" stroke-width="4"/>
      <circle cx="54" cy="75" r="11" fill="#0D1117" stroke="#A371F7" stroke-width="4"/>
      <circle cx="142" cy="123" r="11" fill="#0D1117" stroke="#A371F7" stroke-width="4"/>
      <circle cx="54" cy="166" r="11" fill="#0D1117" stroke="#22D3EE" stroke-width="4"/>
      <circle cx="54" cy="202" r="13" fill="#0D1117" stroke="#3FB950" stroke-width="4"/>
      <text x="205" y="50" font-size="13" fill="#8B949E">branch</text>
      <text x="205" y="91" font-size="13" fill="#8B949E">testes</text>
      <text x="205" y="132" font-size="13" fill="#8B949E">review</text>
      <text x="205" y="173" font-size="13" fill="#8B949E">CI</text>
      <text x="205" y="213" font-size="13" fill="#E6EDF3" font-weight="700">pull request</text>
      <rect x="178" y="235" width="132" height="30" rx="10" fill="#0B2E23" stroke="#3FB950" stroke-opacity=".45"/>
      <text x="190" y="255" font-size="11" fill="#7EE2A8">pronto para revisão</text>
    </g>

    <path d="M520 214h44" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/><path d="m554 206 10 8-10 8" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
