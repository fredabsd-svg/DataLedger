<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">DataLedger</title>
  <desc id="descricao">Razonete, a conta T da contabilidade: lançamentos de valores diferentes em cada lado e a linha verde de fechamento que mostra que os totais batem.</desc>
  <!--
    Símbolo do DataLedger (DL-013, revisão de 2026-09-13).
    Conceito: o razonete — débito à esquerda, crédito à direita. As larguras
    dos lançamentos são diferentes, mas somam o mesmo nos dois lados
    (84 + 60 + 92 = 236 em cada): valores distintos, totais iguais. A barra
    verde é o fechamento — a conta bateu.
    Uma cor primária (azul-marinho), um acento (esmeralda), sem filtro, sem
    fonte, sem recurso externo. Legível em 32 px e em 128 px, em fundo claro
    e escuro, porque o símbolo carrega o próprio fundo.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C3D70"/>
      <stop offset="1" stop-color="#0A1B36"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <g fill="none" stroke="#F4F7FB" stroke-linecap="round">
    <path d="M100 126H412M256 126V366" stroke-width="38"/>
    <path d="M136 200H220M136 258H196M136 316H228M292 200H376M292 258H352M292 316H384" stroke-width="28"/>
  </g>
  <path d="M116 424H396" fill="none" stroke="#2DD4A0" stroke-linecap="round" stroke-width="30"/>
</svg>
