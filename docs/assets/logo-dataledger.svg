<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="titulo descricao">
  <!-- Conceito: partidas dobradas. Monograma "DL" em que as duas letras têm a mesma altura e -->
  <!-- espessura, unidas por uma linha de equilíbrio: todo lançamento contábil precisa fechar. -->
  <title id="titulo">Logotipo DataLedger</title>
  <desc id="descricao">Monograma das letras D e L, do mesmo tamanho, apoiadas sobre uma linha de equilíbrio, dentro de um selo arredondado escuro.</desc>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="4"/>

  <!-- Letra D: haste + bojo semicircular, sólidos (sem contorno interno) para legibilidade em 32 px -->
  <path d="M26 32 H42 A28 28 0 0 1 42 88 H26 Z" fill="#22D3EE"/>

  <!-- Letra L: haste + base, mesma altura da letra D -->
  <rect x="86" y="32" width="16" height="56" fill="#A371F7"/>
  <rect x="86" y="74" width="34" height="14" fill="#A371F7"/>

  <!-- Linha de equilíbrio: representa o "bater" das partidas dobradas -->
  <rect x="26" y="96" width="94" height="6" rx="3" fill="#3FB950"/>
</svg>
