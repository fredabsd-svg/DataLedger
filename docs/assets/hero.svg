<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DataLedger — visão do produto</title>
  <desc id="desc">Ilustração do núcleo contábil conectado aos módulos Fiscal, Folha, Honorários e Paralegal, com lançamentos e trilha de auditoria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101A2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="80" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#30363D" stroke-width="2"/>
  <circle cx="1055" cy="80" r="180" fill="#22D3EE" opacity=".04"/>
