<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="titulo descricao">
  <!-- Conceito: grade de razão formando a letra D. Linhas horizontais de um livro razão, com -->
  <!-- larguras crescentes e depois decrescentes, desenham o bojo do D; a última linha, o saldo, se destaca em verde. -->
  <title id="titulo">Logotipo DataLedger</title>
  <desc id="descricao">Letra D formada por linhas horizontais de um razão contábil, com a última linha, o saldo, destacada em verde, dentro de um selo arredondado escuro.</desc>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="4"/>

  <!-- Haste vertical do D -->
  <rect x="28" y="30" width="10" height="62" fill="#22D3EE"/>

  <!-- Contorno do bojo do D, para a letra ficar reconhecível mesmo em 32 px -->
  <path d="M38 30 A31 31 0 0 1 38 92" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Linhas do razão: comprimento segue o contorno do bojo do D -->
  <rect x="38" y="32" width="14" height="7" fill="#22D3EE"/>
  <rect x="38" y="43" width="26" height="7" fill="#22D3EE"/>
  <rect x="38" y="54" width="32" height="7" fill="#22D3EE"/>
  <rect x="38" y="65" width="32" height="7" fill="#22D3EE"/>
  <rect x="38" y="76" width="26" height="7" fill="#22D3EE"/>
  <rect x="38" y="87" width="14" height="5" fill="#22D3EE"/>

  <!-- Linha de saldo: destacada, mais longa que as demais -->
  <rect x="30" y="97" width="46" height="7" rx="1" fill="#3FB950"/>
</svg>
