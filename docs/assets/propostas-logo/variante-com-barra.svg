<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">DataLedger</title>
  <desc id="descricao">Laço duplo azul entrelaçado por uma fita verde, com um conjunto de cubos de dados no laço direito.</desc>
  <!--
    Símbolo do DataLedger. Conceito do Fred; execução em vetor plano.
    Entrelaçado de verdade, pela ordem de desenho: laço direito, fita, laço
    esquerdo. A fita nasce escondida na faixa do laço esquerdo (arco de raio
    igual ao do laço, largura menor que a faixa), emerge por baixo dele na
    junção e passa por cima do laço direito até terminar em ponta redonda.
    Dois gradientes suaves, sem filtro, sem sombra, sem fonte, sem recurso
    externo. Funciona em fundo claro e escuro.
  -->
  <defs>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F7FF0"/><stop offset="1" stop-color="#0A3A88"/></linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52E896"/><stop offset="1" stop-color="#0C9A57"/></linearGradient>
    <g id="cubo">
      <path d="M0 -24 L21 -12 L0 0 L-21 -12 Z" fill="#52E896"/>
      <path d="M-21 -12 L0 0 L0 24 L-21 12 Z" fill="#2F7FF0"/>
      <path d="M21 -12 L0 0 L0 24 L21 12 Z" fill="#0A3A88"/>
    </g>
  </defs>
  <!-- laço direito (fica por baixo da fita) -->
  <circle cx="366" cy="256" r="120" fill="none" stroke="url(#azul)" stroke-width="50"/>
  <!-- fita verde: começa escondida na faixa do laço esquerdo -->
  <path d="M177.1 140.1A120 120 0 0 1 258.8 215.0C291 268 301 328 350 362C400 396 448 372 476 322" fill="none" stroke="url(#verde)" stroke-width="48" stroke-linecap="round"/>
  <!-- laço esquerdo (fica por cima da fita) -->
  <circle cx="146" cy="256" r="120" fill="none" stroke="url(#azul)" stroke-width="50"/>
  <!-- barra do laço esquerdo (retângulo, não traço: gradiente precisa de caixa com altura) -->
  <rect x="125" y="231" width="132" height="50" rx="25" fill="url(#azul)"/>
  <!-- cubos de dados -->
  <g transform="translate(366 250)">
    <use href="#cubo" x="0" y="-48"/><use href="#cubo" x="-42" y="-24"/><use href="#cubo" x="42" y="-24"/>
    <use href="#cubo" x="0" y="0"/><use href="#cubo" x="-42" y="24"/><use href="#cubo" x="42" y="24"/><use href="#cubo" x="0" y="48"/>
  </g>
</svg>
