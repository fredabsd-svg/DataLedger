<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="titulo descricao">
  <!-- Conceito: livro-razão aberto. Duas páginas espelhadas com linhas de lançamento que se -->
  <!-- alinham pela lombada; a linha final, destacada em verde, atravessa as duas páginas: o livro bate. -->
  <title id="titulo">Logotipo DataLedger</title>
  <desc id="descricao">Livro-razão aberto visto de frente, com linhas de lançamento em cada página alinhadas e uma linha de saldo destacada que une as duas páginas, dentro de um selo arredondado escuro.</desc>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="4"/>

  <!-- Páginas do livro, abertas e espelhadas em torno da lombada central -->
  <path d="M64 58 L26 46 L26 94 L64 82 Z" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-width="5" stroke-linejoin="round"/>
  <path d="M64 58 L102 46 L102 94 L64 82 Z" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-width="5" stroke-linejoin="round"/>

  <!-- Lombada -->
  <line x1="64" y1="58" x2="64" y2="82" stroke="#22D3EE" stroke-width="5"/>

  <!-- Linha de lançamento, alinhada entre as duas páginas -->
  <line x1="34" y1="64" x2="55" y2="67" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>
  <line x1="73" y1="67" x2="94" y2="64" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>

  <!-- Linha de saldo: destacada, contínua entre as duas páginas — o livro bate -->
  <path d="M30 88 L64 78 L98 88" fill="none" stroke="#3FB950" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
