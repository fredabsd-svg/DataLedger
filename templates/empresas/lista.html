<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Empresas — DataLedger</title>
</head>
<body>
    <p><a href="{% url 'tenancy:painel' %}">Voltar ao painel</a></p>
    <h1>Empresas</h1>
    <p><a href="{% url 'empresas:criar' %}">Nova empresa</a></p>
    <ul>
        {% for empresa in empresas %}
            <li>{{ empresa.razao_social }} — {{ empresa.cnpj }}</li>
        {% empty %}
            <li>Nenhuma empresa cadastrada neste escritório.</li>
        {% endfor %}
    </ul>
</body>
</html>
